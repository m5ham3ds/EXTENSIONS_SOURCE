name: Build Mangapro Extension

on:
  push:
    branches: [ main ]
    paths:
      - 'src/ar/mangapro/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build extension
        run: ./gradlew :src:ar:mangapro:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mangapro-extension
          path: src/ar/mangapro/build/outputs/apk/debug/*.apk
